[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "quant-trader"
version = "0.1.0"
description = "Phase 1 foundation for a modular quantitative trading platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "QuantTrader" }]
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_trader"]
